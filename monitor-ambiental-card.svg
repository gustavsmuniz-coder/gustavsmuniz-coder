<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
  <title id="title">Monitor Ambiental — ilustração noir de sensores</title>
  <desc id="desc">Ilustração conceitual monocromática em estilo noir de uma placa com sensores. Não é captura de tela nem gráfico de medições reais.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B2031"/><stop offset="1" stop-color="#112B42"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D788C"/><stop offset="1" stop-color="#155267"/>
    </linearGradient>
    <pattern id="dots" width="23" height="23" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#6FDCE7" opacity=".18"/>
    </pattern>
    <filter id="noir" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <g filter="url(#noir)">
  <rect width="1000" height="310" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="310" rx="20" fill="url(#dots)"/>
  <rect width="7" height="310" rx="3" fill="#3D9CFF"/>
  <circle cx="36" cy="30" r="5" fill="#20BCC9"/><circle cx="53" cy="30" r="5" fill="#1F7192"/><circle cx="70" cy="30" r="5" fill="#28546D"/>

  <!-- Stylized sensor board: illustrative, not empirical data -->
  <rect x="64" y="69" width="358" height="193" rx="20" fill="#082333" stroke="#23617A" stroke-width="3"/>
  <path d="M104 230H385M104 101H385" stroke="#205E6D" stroke-width="2" stroke-dasharray="6 8"/>
  <rect x="95" y="103" width="129" height="121" rx="11" fill="url(#pcb)" stroke="#4DD9E2" stroke-width="3"/>
  <rect x="117" y="119" width="85" height="78" rx="8" fill="#123B4A" stroke="#A3EBEB" stroke-width="2"/>
  <g stroke="#60DBE2" stroke-width="5" stroke-linecap="round">
    <path d="M130 134H188M130 147H188M130 160H188M130 173H188"/>
  </g>
  <text x="158" y="213" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#EAFBFF">DHT11</text>
  <path d="M224 157H251V124H267M224 184H250V223H272" fill="none" stroke="#48BECB" stroke-width="4"/>
  <rect x="267" y="104" width="117" height="117" rx="12" fill="url(#pcb)" stroke="#55A7CC" stroke-width="3"/>
  <circle cx="326" cy="157" r="38" fill="#0D2B41" stroke="#6CDAE5" stroke-width="6"/>
  <circle cx="326" cy="157" r="20" fill="#2D7595" stroke="#A0EBF3" stroke-width="2"/>
  <path d="M326 141V173M310 157H342" stroke="#B8FAFF" stroke-width="3"/>
  <text x="326" y="211" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#EAFBFF">BMP180</text>
  <g fill="#37D0DB">
    <circle cx="79" cy="89" r="5"/><circle cx="407" cy="89" r="5"/><circle cx="79" cy="243" r="5"/><circle cx="407" cy="243" r="5"/>
  </g>
  <path d="M420 163H469M449 151L468 163L449 175" fill="none" stroke="#3ABACC" stroke-width="3" stroke-linecap="round"/>

  <rect x="520" y="49" width="117" height="24" rx="12" fill="#16455D"/>
  <text x="578" y="65" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#7ABEF8" text-anchor="middle">PORTFÓLIO</text>
  <text x="520" y="115" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="800" fill="#F3FAFC">Monitor <tspan fill="#58B6FF">Ambiental</tspan></text>
  <text x="520" y="147" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#D0E1EB">Monitoramento do ambiente</text>
  <text x="520" y="175" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#D0E1EB">e ocupação com sensores.</text>
  <rect x="520" y="207" width="105" height="36" rx="9" fill="#18455F" stroke="#387FBD"/>
  <text x="572" y="231" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#EAF9FF" text-anchor="middle">DHT11</text>
  <rect x="637" y="207" width="119" height="36" rx="9" fill="#18455F" stroke="#387FBD"/>
  <text x="697" y="231" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#EAF9FF" text-anchor="middle">BMP180</text>
  <text x="520" y="284" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.2" fill="#7DA3B3">ILUSTRAÇÃO CONCEITUAL</text>
  </g>
</svg>
