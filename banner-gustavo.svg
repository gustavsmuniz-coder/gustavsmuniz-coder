    <circle cx="1224" cy="113" r="5"/><circle cx="1230" cy="214" r="5"/>
    <circle cx="943" cy="71" r="4"/><circle cx="1033" cy="55" r="4"/><circle cx="1124" cy="67" r="4"/>
