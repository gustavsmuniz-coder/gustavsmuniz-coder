<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Gustavo Suzart — portfólio noir</title>
  <desc id="desc">Banner em estilo noir tecnológico, preto e prata, com monograma GS, o nome Gustavo Suzart e uma janela de terminal.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060708"/>
      <stop offset=".54" stop-color="#181A1E"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#646A73"/>
      <stop offset=".53" stop-color="#F3F3F3"/>
      <stop offset="1" stop-color="#7C828A"/>
    </linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F4F5" stop-opacity=".17"/>
      <stop offset="1" stop-color="#9D9FA8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lines" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#BEC1C7" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <pattern id="rain" width="88" height="105" patternUnits="userSpaceOnUse" patternTransform="skewX(-15)">
      <path d="M12 -10V34M53 55V108" stroke="#E3E3E3" stroke-opacity=".055" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#night)"/>
  <rect width="1280" height="360" rx="22" fill="url(#lines)"/>
  <rect width="1280" height="360" rx="22" fill="url(#rain)"/>
  <path d="M840 0H1090L920 360H662Z" fill="url(#spot)"/>
  <path d="M1114 0H1186L1060 360H987Z" fill="#D3D5D8" opacity=".028"/>
  <rect x="16" y="16" width="1248" height="328" rx="14" fill="none" stroke="#74777D" stroke-width="1.4" opacity=".36"/>
  <path d="M48 46H154M1128 46H1230" stroke="url(#silver)" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <text x="60" y="328" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2.6" fill="#92959C">BAHIA / BRASIL — 2026</text>

  <!-- Metallic monogram, inspired by a noir title card -->
  <g>
    <rect x="67" y="115" width="126" height="126" rx="12" fill="#0A0B0D" stroke="#989BA2" stroke-width="2"/>
    <path d="M80 127H181M80 229H181" stroke="#3F424A" stroke-width="2"/>
    <path d="M78 217L184 111" stroke="#B8BBC0" stroke-width="2" opacity=".5"/>
    <text x="130" y="199" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800" letter-spacing="-4" fill="#F0F1F2">GS</text>
  </g>

  <text x="234" y="111" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="5" font-weight="700" fill="#B8BAC1">TECH / PORTFÓLIO</text>
  <text x="231" y="183" font-family="Arial,Helvetica,sans-serif" font-size="63" letter-spacing="-1.8" font-weight="800" fill="#F4F4F4">Gustavo Suzart</text>
  <path d="M235 209H334" stroke="url(#silver)" stroke-width="5" stroke-linecap="round"/>
  <text x="234" y="249" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#D4D5D8">Técnico em Informática</text>
  <text x="234" y="283" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#A4A7AD">Código  /  Sensores  /  Modelagem 3D</text>

  <!-- Terminal window -->
  <g>
    <rect x="873" y="80" width="341" height="202" rx="12" fill="#08090B" stroke="#747982" stroke-width="2"/>
    <rect x="873" y="80" width="341" height="35" rx="12" fill="#272A30"/>
    <path d="M873 102V115H1214V102" fill="#272A30"/>
    <path d="M873 115H1214" stroke="#63676F" opacity=".7"/>
    <circle cx="896" cy="97" r="5" fill="#888C93"/>
    <circle cx="913" cy="97" r="5" fill="#5F646B"/>
    <circle cx="930" cy="97" r="5" fill="#43464C"/>
    <text x="1057" y="101" text-anchor="middle" font-family="monospace" font-size="12" fill="#B4B6BC">gustavo@portfolio</text>
    <text x="894" y="148" font-family="monospace" font-size="18" fill="#EBEBEB">$ whoami</text>
    <text x="894" y="174" font-family="monospace" font-size="18" fill="#AEB2B8">gustavo-suzart</text>
    <text x="894" y="207" font-family="monospace" font-size="18" fill="#EBEBEB">$ ls projetos/</text>
    <text x="894" y="234" font-family="monospace" font-size="18" fill="#AEB2B8">3d  web  sensores</text>
    <text x="894" y="261" font-family="monospace" font-size="18" fill="#DADDE0">&gt; <tspan fill="#EDEFF1">_</tspan></text>
  </g>
  <path d="M846 81V281M1234 81V281" stroke="#BEC1C7" stroke-width="1" opacity=".22"/>
  <path d="M45 313H1235" stroke="#8A8C92" stroke-width="1" opacity=".28"/>
  <text x="1219" y="329" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2.4" fill="#83868E">PORTFÓLIO / NOIR EDITION</text>
</svg>
