    <path d="M880 137H916M884 184H916M1150 139H1193V113H1224M1150 190H1205V214H1230" stroke="#4BA3C4" stroke-opacity="0.60" stroke-width="2.5"/>
    <path d="M943 71V87M1033 55V87M1124 67V87" stroke="#50BBCB" stroke-opacity="0.60" stroke-width="2.5"/>
